<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siti di esempio</title><meta name="robots" content="noindex">
<style>
:root{--fondo:#f4f7fb;--carta:#fff;--testo:#0f1b2d;--tenue:#5d6b80;--acc:#1f5fd1}
@media (prefers-color-scheme:dark){:root{--fondo:#0c1320;--carta:#141e30;--testo:#e6edf7;--tenue:#9aa8bd}}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--testo)}
main{max-width:980px;margin:0 auto;padding:48px 16px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:0 0 10px}p{color:var(--tenue);margin:0 0 28px;max-width:620px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
a.c{display:block;background:var(--carta);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 0 #0001;transition:transform .15s}
a.c:hover{transform:translateY(-3px)}a.c img{display:block;width:100%;aspect-ratio:8/5;object-fit:cover}a.c b{display:block;padding:12px 14px}
small{display:block;margin-top:36px;color:var(--tenue)}
</style></head><body><main>
<h1>Siti di esempio per attività locali</h1>
<p>Quattro siti dimostrativi: attività, persone, numeri e recensioni sono inventati. Aprili dal telefono: è lì che li usano i clienti.</p>
<div class="g">
<a class="c" href="pizzeria-demo/"><img src="img/esempio-pizzeria.jpg" alt=""><b>Pizzeria</b></a>
<a class="c" href="agriturismo-demo/"><img src="img/esempio-agriturismo.jpg" alt=""><b>Agriturismo</b></a>
<a class="c" href="autoscuola-demo/"><img src="img/esempio-autoscuola.jpg" alt=""><b>Autoscuola</b></a>
<a class="c" href="parrucchiere-demo/"><img src="img/esempio-parrucchiere.jpg" alt=""><b>Parrucchiera</b></a>
</div>
<small>Esempi a scopo dimostrativo.</small>
</main></body></html>
